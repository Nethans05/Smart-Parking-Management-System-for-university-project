<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Parking API</title>
    <style>
      body {
        background: #0f172a;
        color: #f8fafc;
        font-family: "Inter", system-ui, sans-serif;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      .card {
        background: #1e293b;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.35);
        max-width: 480px;
        width: 100%;
        text-align: center;
      }

      .pulse {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .pulse span {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #22c55e;
        animation: pulse 1.2s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.75);
          opacity: 0.7;
        }
        60% {
          transform: scale(1.05);
          opacity: 1;
        }
        100% {
          transform: scale(0.75);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Smart Parking API</h1>
      <p>
        The backend is running successfully on <strong>http://localhost:5000</strong>.
        Use <code>/api/auth</code>, <code>/api/reports</code>, or <code>/api/bookings</code>
        to interact with the services.
      </p>
      <div class="pulse">
        <span aria-hidden="true"></span>
        <span>Backend online</span>
      </div>
    </div>
  </body>
</html>
